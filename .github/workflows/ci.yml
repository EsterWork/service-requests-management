name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (unit + integration tests on SQL Server)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Password of a throwaway container that exists only for this CI run.
          MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build backend/ServiceRequests.sln --configuration Release

      - name: Test
        run: dotnet test backend/ServiceRequests.sln --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          SERVICE_REQUESTS_TEST_DB: Server=localhost,1433;Database=ServiceRequests_Tests;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True

  frontend:
    name: Frontend (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
